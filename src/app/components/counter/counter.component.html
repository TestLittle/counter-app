<ion-card>
  <ion-card-header>
    <ion-card-title>{{ heading() }}</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-input
    label="Název počítadla"
    label-placement="stacked"
    fill="outline"
    placeholder="Například počet objednávek"
    [(ngModel)]="counterName"
    ></ion-input>

    @if(count === 0){
      <p class="counter-value-zero"> {{ count }}</p>
    }@else {
      <p class="counter-value"> {{ count }}</p>
    }
    
    <div class="counter-actions">
      <ion-button color="danger" [disabled]="count === 0" (click)="decrement()">
        -1
      </ion-button>

      <ion-button color="primary" (click)="increment()">
        +1
      </ion-button>

      <ion-button color="medium" fill="outline" [disabled]="count === 0" (click)="reset()">
        Reset
      </ion-button>
    </div>
    <div class="counter-actions">
      <ion-button color="danger" [disabled]="count < 5" (click)="decrementByFive()">
        -5
      </ion-button>
      <ion-button color="primary" (click)="incrementByFive()">
        +5
      </ion-button>
      <ion-input type="text" placeholder="Krok">

      </ion-input>
    </div>

    <ion-button id="save-counter" class="save-button" expand="block" color="success" [disabled]="!counterName.trim()" (click)="save()">
      Uložit počítadlo
    </ion-button>
    <ion-toast trigger="save-counter" message="Počítadlo úspěšně uloženo!" [duration]="2000">

    </ion-toast>
  </ion-card-content>
</ion-card>
